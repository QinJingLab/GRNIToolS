# GRN -- conda environment for the R package and the shared R/compiler toolchain.
# Portable: no build strings and no prefix, so it can be recreated on another machine.
#
#   1) CONDA_CHANNEL_PRIORITY=strict conda env create -f grnitools.yaml
#      (the environment was solved with strict channel priority; conda 26.1's
#       `conda env create` has no flag for it, so set the variable or run
#       `conda config --set channel_priority strict`.)
#   2) conda activate grnitools
#   3) Rscript install_deps.R          <- required
#
# Python 3.10 and pip are included; the Python libraries themselves come from
# the two requirements.txt files in the packages.
#
# This file covers only what conda provides. These R packages are not on
# conda-forge or bioconda and are installed afterwards by install_deps.R:
#   CRAN   : foba (archived), WGCNA, c3net, bc3net, doRNG, plyr
#   Bioc   : parmigene, PCIT, GeneNet, graph
#   GitHub : slawekj/ennet
#   local  : GRNIToolS itself
#
name: grnitools
# Only conda-forge and bioconda. `nodefaults` must stay: a global .condarc that
# lists `defaults` is merged back in by `conda env create`, which takes no
# --override-channels/-c flag, and `nodefaults` is the only way to exclude it.
channels:
  - conda-forge
  - bioconda
  - nodefaults
